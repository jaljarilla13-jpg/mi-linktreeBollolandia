<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Enlaces</title>
  <style>
    /* Fuente más moderna */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(270deg, #6c5ce7, #00cec9, #fd79a8);
      background-size: 600% 600%;
      animation: gradientBG 15s ease infinite;
      color: white;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: rgba(0, 0, 0, 0.4);
      padding: 30px;
      border-radius: 20px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    img {
      border-radius: 50%;
      width: 120px;
      margin-bottom: 15px;
      border: 3px solid white;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .link {
      display: block;
      margin: 12px 0;
      padding: 15px;
      background: white;
      color: #333;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
      transition: all 0.3s ease;
    }

    .link:hover {
      background: #ffeaa7;
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://via.placeholder.com/120" alt="Mi foto">
    <h1>🌟 Hola, soy TuNombre 🌟</h1>
    <a href="https://instagram.com/tuusuario" class="link">📸 Instagram</a>
    <a href="https://youtube.com/tuusuario" class="link">▶️ YouTube</a>
    <a href="https://wa.me/5211234567890" class="link">💬 WhatsApp</a>
    <a href="https://tiktok.com/@tuusuario" class="link">🎵 TikTok</a>
  </div>
</body>
</html>

</html>
